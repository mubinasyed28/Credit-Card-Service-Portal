# ---------------------------------------------------------------------------
# [ccsp_servers] — Target application servers running the CCSP container
# ---------------------------------------------------------------------------
[ccsp_servers]
ccsp-target  ansible_host=127.0.0.1  ansible_connection=local

# ---------------------------------------------------------------------------
# [ccsp_servers:vars] — Shared variables for CCSP target group
# ---------------------------------------------------------------------------
[ccsp_servers:vars]
ansible_python_interpreter=/usr/bin/python3

# Application identity
app_name=credit-card-app
app_version=1.0.0
docker_registry=mubina23102a0039
image_name={{ docker_registry }}/{{ app_name }}
image_tag={{ app_version }}.5
container_name=ccsp-live
host_port=8080
container_port=8080
spring_profile=production
deploy_dir=/opt/credit-card-app

# Docker runtime settings
docker_memory_limit=512m
docker_restart_policy=unless-stopped

# Health check
actuator_health_url=http://localhost:{{ host_port }}/actuator/health
health_check_retries=5
health_check_delay=10

# ---------------------------------------------------------------------------
# [docker_registry_hosts] — Docker Hub registry (remote push target)
# ---------------------------------------------------------------------------
[docker_registry_hosts]
docker-hub  ansible_host=hub.docker.com  ansible_connection=local

# ---------------------------------------------------------------------------
# [all:vars] — Global variables applied to every host
# ---------------------------------------------------------------------------
[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
