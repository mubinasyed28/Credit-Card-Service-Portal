version: '3.8'

services:
  credit-card-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: credit-card-app:1.0.0
    container_name: credit-card-portal-container
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SERVER_PORT=8080
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    labels:
      maintainer: "Mubina (Roll No: 23102A0039)"
      project: "Credit Card Service Portal"
      task: "Task 11: Docker Container Lifecycle"
